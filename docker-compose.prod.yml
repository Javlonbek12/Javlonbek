# Production: docker compose -f docker-compose.prod.yml up -d
# Settings come from .env next to this file (see docs/SETUP-SERVER.md).
name: assistant

# Each service keeps at most 3 × 10 MB of logs (Docker's default keeps them all, forever).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  build: .
  image: assistant-app
  restart: unless-stopped
  logging: *logging
  env_file: .env
  environment:
    NODE_ENV: production
    DATABASE_URL: postgresql://assistant:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/assistant
    UPLOAD_DIR: /data/uploads
    SERVER_BACKUPS_DIR: /backups
  volumes:
    - uploads:/data/uploads
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: assistant
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Applies database migrations and exits; the app starts after it succeeds.
  migrate:
    <<: *app
    restart: "no"
    command: ["npx", "prisma", "migrate", "deploy"]

  app:
    <<: *app
    # The backup folder, read-only, for the owner's «Сервер и бэкапы» card in the settings.
    volumes:
      - uploads:/data/uploads
      - ~/assistant-backups:/backups:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Reminders, digests, meeting reminders (every minute).
  worker:
    <<: *app
    command: ["node", "--import", "tsx", "modules/scheduler/worker.ts"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Tells the OWNER in Telegram if the site, the scheduler or the bot stops working.
  watchdog:
    <<: *app
    command: ["node", "--import", "tsx", "scripts/watchdog.ts"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://assistant:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/assistant
      APP_HEALTH_URL: http://app:3000/api/health
    volumes: []
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Own speech recognition (faster-whisper, model large-v3-turbo, CPU). Turned on by
  # COMPOSE_PROFILES=whisper in .env; without it use STT_PROVIDER=openai or mock.
  whisper:
    image: fedirz/faster-whisper-server:latest-cpu
    profiles: ["whisper"]
    restart: unless-stopped
    logging: *logging
    # --no-sync: start the server as installed in the image, without re-checking packages online.
    command:
      ["uv", "run", "--no-sync", "uvicorn", "--factory", "faster_whisper_server.main:create_app"]
    environment:
      # large-v3-turbo: much better with Uzbek than "small"; int8 is the fast mode on CPU.
      WHISPER__MODEL: deepdml/faster-whisper-large-v3-turbo-ct2
      WHISPER__INFERENCE_DEVICE: cpu
      WHISPER__COMPUTE_TYPE: int8
      # Keep the model in memory (no 3-second reload after every pause).
      WHISPER__TTL: "-1"
    volumes:
      - whisper-models:/root/.cache/huggingface

  caddy:
    image: caddy:2
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  postgres-data:
  uploads:
  whisper-models:
  caddy-data:
  caddy-config:
