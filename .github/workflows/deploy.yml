name: Deploy

# After CI is green on main, the server pulls the new code and restarts.
# Needs repository secrets VPS_HOST, VPS_USER, VPS_SSH_KEY (see docs/SETUP-SERVER.md).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      # Folder of the project on the server (relative to the user's home).
      APP_DIR: ${{ vars.VPS_APP_DIR || 'assistant' }}
    steps:
      - name: Deploy over SSH
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "Secrets VPS_HOST / VPS_USER / VPS_SSH_KEY are not set: skipping deploy."
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" "cd ~/$APP_DIR && ./scripts/deploy.sh"
