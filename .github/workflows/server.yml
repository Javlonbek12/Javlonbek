name: Server

# Works with the VPS over SSH. The key and the passwords live only in the repository
# secrets; nobody sees them in the logs.
#   status  - what is running, memory, disk, recent logs (changes nothing)
#   setup   - first installation (safe to repeat): Docker, firewall, settings, start, backups, bot
#   deploy  - copy the current code and restart (also runs by itself after green CI on main)
#   logs    - last 200 log lines of one service
#   backup  - make a backup now
#   backup-export - the latest backup (database + files), encrypted for a public key made on the
#     owner's own computer, as a file of the run (kept 1 day). "data" is {"key": "<PEM public key>"}.
#     Only the private key on that computer opens it, so the public repository can hold it.
#   restart - restart all services
#   demo-add / demo-remove - add or remove test tasks and test employees (after deploy)
#   org-import / org-replace - load the org chart from the JSON in "data" (replace = drop the current one)
#   project-import - load a project plan from the JSON in "data" (see modules/projects/import.ts)
#   project-create - create a project from a template (JSON in "data", see scripts/project-create.ts)
#   team-check / team-fix - show users, roles and places; apply fixes from the JSON in "data" (modules/team/admin.ts)
#   data-key / data-load - load business data (Connect exports, planogram library) prepared outside
#     the app. data-key prints the server's public key; the file is committed only encrypted
#     (deploy/data/X.enc with AES-256, its key in X.enc.key encrypted with that public key), so only
#     the server can read it. "data" is {"file": "deploy/data/X.enc"}.
# Secrets: VPS_HOST, VPS_USER (root), VPS_SSH_KEY; for setup also TELEGRAM_BOT_TOKEN,
# TELEGRAM_BOT_USERNAME, ANTHROPIC_API_KEY. Variable (optional): DOMAIN. See docs/SETUP-SERVER.md.
on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        options:
          [
            status,
            setup,
            deploy,
            logs,
            backup,
            backup-export,
            restart,
            demo-add,
            demo-remove,
            org-import,
            org-replace,
            project-import,
            project-create,
            team-check,
            team-fix,
            data-key,
            data-load,
          ]
        default: status
      service:
        description: "For logs: app, worker, watchdog, caddy, postgres, whisper, migrate"
        type: string
        default: app
      data:
        description: "For org-import / org-replace / project-import / team-fix: the data as JSON"
        type: string
        default: ""
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency: server

jobs:
  server:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ACTION: ${{ github.event_name == 'workflow_run' && 'deploy' || inputs.action }}
      SERVICE: ${{ inputs.service }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Connect
        id: connect
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "Secrets VPS_HOST / VPS_USER / VPS_SSH_KEY are not set: nothing to do."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_vps
          chmod 600 ~/.ssh/id_vps
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2> /dev/null
          printf 'Host vps\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_vps\n  ServerAliveInterval 30\n' \
            "$VPS_HOST" "$VPS_USER" > ~/.ssh/config
          ssh vps 'echo "Connected to $(hostname) as $(whoami)"'
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Copy the code to the server
        if: steps.connect.outputs.ready == 'true' && (env.ACTION == 'setup' || env.ACTION == 'deploy')
        run: |
          # The code folders come only from git: clear them first, so deleted files don't linger
          # (.env and other server-only files at the top level stay).
          ssh vps 'mkdir -p ~/assistant && cd ~/assistant && rm -rf app assets components deploy docker docs lib modules prisma public scripts tests'
          git archive --format=tar HEAD | ssh vps 'tar -x -C ~/assistant'
          ssh vps "echo '$(git log -1 --format='%h %cs %s' | tr -d "'")' > ~/assistant/REVISION"

      - name: Run
        if: steps.connect.outputs.ready == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_USERNAME: ${{ secrets.TELEGRAM_BOT_USERNAME }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DOMAIN: ${{ vars.DOMAIN }}
          ORG_DATA: ${{ inputs.data }}
        run: |
          case "$ACTION" in
            status)
              ssh vps 'bash -s' < scripts/server/status.sh ;;
            setup)
              # Without an own domain: a free name that points to the server IP (e.g. 5-182-33-60.sslip.io).
              domain="$DOMAIN"
              if [ -z "$domain" ]; then
                ip="$VPS_HOST"
                [[ "$ip" =~ ^[0-9]+(\.[0-9]+){3}$ ]] || ip="$(ssh vps 'curl -fsS -4 https://api.ipify.org')"
                domain="$(echo "$ip" | tr . -).sslip.io"
              fi
              {
                echo "DOMAIN=$domain"
                echo "TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN"
                echo "TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME#@}"
                echo "ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY"
              } | ssh vps 'umask 077 && cat > ~/.assistant-provided.env'
              ssh vps 'bash ~/assistant/scripts/server/setup.sh' ;;
            deploy)
              ssh vps 'cd ~/assistant && ./scripts/deploy.sh' ;;
            logs)
              if ! [[ "$SERVICE" =~ ^[a-z]+$ ]]; then echo "Unknown service: $SERVICE"; exit 1; fi
              ssh vps "cd ~/assistant && docker compose -f docker-compose.prod.yml logs --tail 200 --timestamps $SERVICE" ;;
            backup)
              ssh vps '~/assistant/scripts/backup.sh' ;;
            demo-add)
              ssh vps 'cd ~/assistant && docker compose -f docker-compose.prod.yml run --rm -T app node --import tsx scripts/demo-data.ts add' ;;
            demo-remove)
              ssh vps 'cd ~/assistant && docker compose -f docker-compose.prod.yml run --rm -T app node --import tsx scripts/demo-data.ts remove' ;;
            org-import | org-replace)
              flag=""; [ "$ACTION" = "org-replace" ] && flag="--replace"
              printf '%s' "$ORG_DATA" | ssh vps "cd ~/assistant && docker compose -f docker-compose.prod.yml run --rm -T app node --import tsx scripts/org-import.ts $flag" ;;
            project-import)
              printf '%s' "$ORG_DATA" | ssh vps "cd ~/assistant && docker compose -f docker-compose.prod.yml run --rm -T app node --import tsx scripts/project-import.ts" ;;
            project-create)
              printf '%s' "$ORG_DATA" | ssh vps "cd ~/assistant && docker compose -f docker-compose.prod.yml run --rm -T app node --import tsx scripts/project-create.ts" ;;
            team-check)
              ssh vps 'cd ~/assistant && docker compose -f docker-compose.prod.yml run --rm -T app node --import tsx scripts/team.ts check' ;;
            team-fix)
              printf '%s' "$ORG_DATA" | ssh vps "cd ~/assistant && docker compose -f docker-compose.prod.yml run --rm -T app node --import tsx scripts/team.ts fix" ;;
            data-key)
              # The server's own key pair for data-load: the private key never leaves the server,
              # the public one is printed here to encrypt files with.
              ssh vps 'mkdir -p ~/.assistant-keys && chmod 700 ~/.assistant-keys && cd ~/.assistant-keys \
                && { [ -f data.pem ] || openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out data.pem 2> /dev/null; } \
                && chmod 600 data.pem && openssl pkey -in data.pem -pubout' ;;
            data-load)
              file="$(printf '%s' "$ORG_DATA" | jq -r .file)"
              if ! [[ "$file" =~ ^deploy/data/[A-Za-z0-9._-]+\.enc$ ]] || [ ! -f "$file" ] || [ ! -f "$file.key" ]; then echo "No such data file"; exit 1; fi
              scp -q "$file" "$file.key" vps:/tmp/
              name="$(basename "$file")"
              ssh vps "set -o pipefail; cd ~/assistant && openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in /tmp/$name \
                -pass file:<(openssl pkeyutl -decrypt -pkeyopt rsa_padding_mode:oaep -inkey ~/.assistant-keys/data.pem -in /tmp/$name.key) | gunzip \
                | docker compose -f docker-compose.prod.yml run --rm -T app node --import tsx scripts/data-load.ts; \
                status=\$?; rm -f /tmp/$name /tmp/$name.key; exit \$status" ;;
            backup-export)
              set -o pipefail
              printf '%s' "$ORG_DATA" | jq -r .key > /tmp/owner.pub
              openssl pkey -pubin -in /tmp/owner.pub -noout 2> /dev/null || { echo "Not a public key"; exit 1; }
              db="$(ssh vps 'ls -t ~/assistant-backups/db-*.sql.gz 2> /dev/null | head -1')"
              [ -n "$db" ] || { echo "No backups yet: run backup first"; exit 1; }
              stamp="$(basename "$db" .sql.gz)"
              stamp="${stamp#db-}"
              mkdir -p export
              # A one-time AES key for the file, itself encrypted with the owner's public key.
              openssl rand -hex 32 > /tmp/pass
              ssh vps "cd ~/assistant-backups && tar -cf - db-$stamp.sql.gz \$(ls uploads-$stamp.tar.gz 2> /dev/null)" \
                | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass file:/tmp/pass -out "export/backup-$stamp.tar.enc"
              openssl pkeyutl -encrypt -pubin -inkey /tmp/owner.pub -pkeyopt rsa_padding_mode:oaep \
                -in /tmp/pass -out "export/backup-$stamp.tar.enc.key"
              rm -f /tmp/pass
              ls -l export ;;
            restart)
              ssh vps 'cd ~/assistant && docker compose -f docker-compose.prod.yml restart && docker compose -f docker-compose.prod.yml ps' ;;
            *)
              echo "Unknown action: $ACTION"; exit 1 ;;
          esac

      - name: Keep the encrypted backup
        if: steps.connect.outputs.ready == 'true' && env.ACTION == 'backup-export'
        uses: actions/upload-artifact@v4
        with:
          name: backup
          path: export/
          retention-days: 1
