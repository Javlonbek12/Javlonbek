name: CI

# One run per change: a pull request's own, and main's after the merge (the deploy follows that
# one). A push to a branch with an open pull request used to run the same checks twice, and the
# repository is private, so every minute counts against the account's included Actions minutes.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same pull request replaces the run in progress; main's runs are never cut.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: assistant
          POSTGRES_PASSWORD: assistant
          POSTGRES_DB: assistant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U assistant"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://assistant:assistant@localhost:5432/assistant_test
      TEST_DATABASE_URL: postgresql://assistant:assistant@localhost:5432/assistant_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Browser tests of the build above, against a database of their own.
      - name: Create the e2e database
        run: psql postgresql://assistant:assistant@localhost:5432/assistant_test -c "CREATE DATABASE assistant_e2e_test"
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # With the browser cached this only installs the system libraries it needs.
      - run: npx playwright install --with-deps chromium
      - id: e2e
        run: npm run test:e2e
        env:
          E2E_DATABASE_URL: postgresql://assistant:assistant@localhost:5432/assistant_e2e_test
      - name: Keep the Playwright report
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
